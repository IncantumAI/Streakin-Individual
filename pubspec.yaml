name: streakin
description: "A private, calm, beautiful place to build habits and think in notes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^18.0.2

  # Immutability / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Database
  drift: ^2.31.0
  sqlcipher_flutter_libs: 0.6.8
  sqlite3: ^2.9.4

  # Cryptography
  cryptography: ^2.7.0
  # Secure storage & biometrics
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2

  # Preferences (non-sensitive only)
  shared_preferences: ^2.3.4

  # File system & paths
  path_provider: ^2.1.5
  path: ^1.9.1

  # Notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  permission_handler: ^13.0.2

  # UI / Design
  animations: ^3.0.0
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^1.2.0

  # Calendar UI
  table_calendar: ^3.1.3

  # Sharing / QR
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0

  # Desktop shell
  window_manager: ^0.5.2
  tray_manager: ^0.7.0
  launch_at_startup: ^0.5.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  logging: ^1.2.0
  wakelock_plus: ^1.2.10
  collection: ^1.19.1
  crypto: 3.0.3
  super_editor: ^0.3.0-dev.52
  xml: ^7.1.0
  image_picker: ^1.2.4
  file_picker: 8.3.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.9.4
  drift_dev: ^2.31.0
  go_router_builder: ^4.5.0

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.2
  flutter_launcher_icons: 0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 24
  # Adaptive icon config — #00000000 (fully transparent) background so the
  # icon fills edge-to-edge without a white layer on Android 8+.
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  macos:
    generate: false

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

  assets:
    - assets/icon.png
    - assets/fonts/
