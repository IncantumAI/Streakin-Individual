name: Release (desktop)

on:
  push:
    branches: ['release/**']

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  windows-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release --dart-define=FLAVOR=prod --obfuscate --split-debug-info=build/symbols
      - name: Build + sign MSIX
        shell: pwsh
        env:
          # Certificate comes from CI secrets; never committed.
          MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          dart pub global activate msix
          if ($env:MSIX_CERT_BASE64) {
            [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
            dart pub global run msix:create --build-windows false --certificate-path cert.pfx --certificate-password $env:MSIX_CERT_PASSWORD
          } else {
            Write-Warning "No signing certificate configured: producing an UNSIGNED MSIX."
            dart pub global run msix:create --build-windows false --sign-msix false
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: build/windows/x64/runner/Release/*.msix

  linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release --dart-define=FLAVOR=prod
      - run: bash linux/packaging/build_deb.sh 0.1.0
      - run: bash linux/packaging/build_appimage.sh 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/deb/*.deb
            build/appimage/*.AppImage
